# Local fact-checking backends: Gemma 4 31B FP8 on vLLM (two GPUs) + SearXNG.
# Start with scripts/start_factcheck_local.sh, which pins the model revision and
# records the resolved image IDs. Both ports bind to localhost only.
#
# Image digests are pinned (multi-arch index digests from Docker Hub, 2026-10-05):
#   vllm/vllm-openai:v0.30.0       searxng/searxng:2026.10.2-19ffbcd30
# The chat template is the Gemma 4 tool-calling template shipped inside the pinned
# vLLM image (examples/tool_chat_template_gemma4.jinja), so it is pinned with it.

name: factcheck

services:
  vlm:
    image: vllm/vllm-openai:v0.30.0@sha256:8a69ffad015f138d7170c4ddc429e230a3bc1c1719f67e14324749df200a4b90
    ipc: host
    gpus: all
    ports:
      - "127.0.0.1:8010:8000"
    volumes:
      - ${FACTCHECK_HF_CACHE:-${HOME}/.cache/huggingface}:/root/.cache/huggingface
    environment:
      HF_TOKEN: ${HF_TOKEN:-}
    command:
      - RedHatAI/gemma-4-31B-it-FP8-dynamic
      - --revision
      - ${FACTCHECK_MODEL_REVISION:?run scripts/start_factcheck_local.sh, which pins the model revision}
      - --tokenizer-revision
      - ${FACTCHECK_MODEL_REVISION:?run scripts/start_factcheck_local.sh, which pins the model revision}
      - --served-model-name
      - gemma-4-31b-it-fp8
      - --tensor-parallel-size
      - "2"
      - --max-model-len
      - "32768"
      - --max-num-seqs
      - "1"
      - --gpu-memory-utilization
      - "0.92"
      - --limit-mm-per-prompt
      - '{"image": 1, "audio": 0}'
      - --enable-auto-tool-choice
      - --tool-call-parser
      - gemma4
      - --reasoning-parser
      - gemma4
      - --chat-template
      - examples/tool_chat_template_gemma4.jinja
      - --seed
      - "0"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 3600s
    restart: unless-stopped

  searxng:
    image: searxng/searxng:2026.10.2-19ffbcd30@sha256:c642712fcedcdaa78fac44f71eada86aff510745826ba1bd1a368211fea2ce7f
    ports:
      - "127.0.0.1:8888:8080"
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: http://127.0.0.1:8888/
      SEARXNG_SECRET: ${SEARXNG_SECRET:?run scripts/start_factcheck_local.sh, which generates it}
    restart: unless-stopped
