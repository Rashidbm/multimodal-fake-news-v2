# Minimal local SearXNG for the fact-checking branch: JSON API on, rate limiter off
# (single local client), defaults for everything else. The secret comes from
# SEARXNG_SECRET in deploy/factcheck/.env (generated by the start script).
use_default_settings: true

general:
  instance_name: "factcheck-local"

server:
  limiter: false
  image_proxy: false
  public_instance: false

search:
  safe_search: 0
  formats:
    - html
    - json

outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
